<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="A minimal diagram linking Japan and Israel, the two places on this page.">
  <rect width="640" height="300" fill="#f2efe9"/>

  <!-- dotted flight path -->
  <path d="M 424 108 Q 320 30 206 148" fill="none" stroke="#a8a29a" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>

  <!-- Japan side: torii -->
  <g stroke="#241f1b" stroke-width="2.4" fill="none">
    <path d="M 424 118 L 520 118"/>
    <path d="M 416 106 Q 472 98 528 106"/>
    <path d="M 440 118 L 440 210"/>
    <path d="M 504 118 L 504 210"/>
    <path d="M 432 140 L 512 140"/>
  </g>
  <text x="472" y="248" text-anchor="middle" font-family="Georgia, serif" font-size="17" letter-spacing="3" fill="#241f1b">JAPAN</text>
  <circle cx="472" cy="268" r="4" fill="#b8472d"/>

  <!-- Israel side: bowl under a sun -->
  <g>
    <circle cx="174" cy="120" r="26" fill="none" stroke="#b8472d" stroke-width="2.4"/>
    <path d="M 118 168 L 230 168 Q 216 214 174 214 Q 132 214 118 168 Z" fill="#fffdf8" stroke="#241f1b" stroke-width="2.4"/>
    <line x1="118" y1="168" x2="230" y2="168" stroke="#241f1b" stroke-width="2.4"/>
    <path d="M 132 188 Q 174 196 216 188" fill="none" stroke="#b8472d" stroke-width="4" opacity="0.85"/>
  </g>
  <text x="174" y="248" text-anchor="middle" font-family="Georgia, serif" font-size="17" letter-spacing="3" fill="#241f1b">ISRAEL</text>
  <circle cx="174" cy="268" r="4" fill="#b8472d"/>

  <!-- horizon -->
  <line x1="48" y1="214" x2="592" y2="214" stroke="#241f1b" stroke-width="1.2" opacity="0.3"/>
</svg>
