<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="A minimal ramen shop front with a noren curtain, a lantern and a counter seen through the doorway.">
  <rect width="640" height="420" fill="#f7f0e9"/>

  <!-- facade -->
  <g stroke="#241f1b" stroke-width="2.4">
    <rect x="96" y="76" width="448" height="280" fill="#f7f4ee"/>
    <line x1="96" y1="124" x2="544" y2="124"/>
    <!-- signboard -->
    <rect x="96" y="76" width="448" height="48" fill="#2f3a44" stroke="#241f1b"/>
  </g>
  <text x="320" y="109" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="12" fill="#f7f0e9">RAMEN</text>

  <!-- doorway -->
  <g stroke="#241f1b" stroke-width="2">
    <rect x="212" y="164" width="216" height="192" fill="#e4ded1"/>
  </g>

  <!-- two customers at the counter, seen from behind -->
  <g stroke="#241f1b" stroke-width="2">
    <path d="M 256 268 q 0 -22 18 -22 q 18 0 18 22 Z" fill="#2f3a44"/>
    <circle cx="274" cy="238" r="14" fill="#f7f4ee"/>
    <path d="M 344 268 q 0 -22 18 -22 q 18 0 18 22 Z" fill="#8a5a43"/>
    <circle cx="362" cy="238" r="14" fill="#f7f4ee"/>
  </g>

  <!-- counter -->
  <g stroke="#241f1b" stroke-width="2">
    <rect x="232" y="266" width="176" height="11" rx="3" fill="#d9c9ae"/>
    <line x1="252" y1="277" x2="252" y2="314"/>
    <line x1="320" y1="277" x2="320" y2="314"/>
    <line x1="388" y1="277" x2="388" y2="314"/>
  </g>

  <!-- noren curtain -->
  <g>
    <rect x="204" y="156" width="232" height="8" rx="3" fill="#241f1b"/>
    <rect x="208" y="164" width="224" height="66" fill="#b8472d" stroke="#241f1b" stroke-width="1.4"/>
    <g stroke="#f7f0e9" stroke-width="4">
      <line x1="253" y1="176" x2="253" y2="230"/>
      <line x1="298" y1="176" x2="298" y2="230"/>
      <line x1="343" y1="176" x2="343" y2="230"/>
      <line x1="388" y1="176" x2="388" y2="230"/>
    </g>
  </g>

  <!-- windows -->
  <g stroke="#241f1b" stroke-width="2" fill="#e8e2d6">
    <rect x="128" y="176" width="60" height="96"/>
    <rect x="452" y="176" width="60" height="96"/>
  </g>
  <g stroke="#241f1b" stroke-width="1" opacity="0.5">
    <line x1="158" y1="176" x2="158" y2="272"/>
    <line x1="128" y1="224" x2="188" y2="224"/>
    <line x1="482" y1="176" x2="482" y2="272"/>
    <line x1="452" y1="224" x2="512" y2="224"/>
  </g>

  <!-- lantern -->
  <g>
    <line x1="560" y1="124" x2="560" y2="150" stroke="#241f1b" stroke-width="1.5"/>
    <rect x="548" y="150" width="24" height="6" fill="#241f1b"/>
    <ellipse cx="560" cy="182" rx="22" ry="28" fill="#e8a33c" stroke="#241f1b" stroke-width="1.6"/>
    <g stroke="#c98a2b" stroke-width="1">
      <line x1="540" y1="170" x2="580" y2="170"/>
      <line x1="538" y1="182" x2="582" y2="182"/>
      <line x1="540" y1="194" x2="580" y2="194"/>
    </g>
    <rect x="548" y="208" width="24" height="6" fill="#241f1b"/>
  </g>

  <!-- ground -->
  <line x1="48" y1="356" x2="592" y2="356" stroke="#241f1b" stroke-width="1.5"/>
</svg>
