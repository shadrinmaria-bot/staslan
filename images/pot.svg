<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="An open stockpot of simmering broth with rising steam, a ladle and a small dish of soy tare beside it.">
  <rect width="640" height="420" fill="#f2efe9"/>

  <!-- steam -->
  <g fill="none" stroke="#a8a29a" stroke-width="2.2" stroke-linecap="round" opacity="0.8">
    <path d="M 226 142 q -18 -32 2 -54 q 20 -22 4 -46"/>
    <path d="M 286 130 q -16 -30 4 -50 q 18 -20 2 -42"/>
    <path d="M 346 142 q -18 -30 0 -50 q 18 -22 2 -44"/>
  </g>

  <!-- table -->
  <line x1="56" y1="330" x2="584" y2="330" stroke="#241f1b" stroke-width="1.5"/>

  <!-- pot -->
  <g stroke="#241f1b" stroke-width="2.4">
    <!-- body -->
    <path d="M 172 178 L 172 306 q 0 14 14 14 L 386 320 q 14 0 14 -14 L 400 178 Z" fill="#e6e9e5"/>
    <!-- handles -->
    <path d="M 172 198 q -28 2 -28 22 q 0 20 28 22" fill="none"/>
    <path d="M 400 198 q 28 2 28 22 q 0 20 -28 22" fill="none"/>
    <!-- broth surface -->
    <ellipse cx="286" cy="178" rx="114" ry="20" fill="#cfa463"/>
    <!-- rim -->
    <path d="M 172 178 a 114 20 0 0 1 228 0" fill="none"/>
  </g>
  <!-- bubbles -->
  <g fill="#e0c785" opacity="0.8">
    <circle cx="256" cy="176" r="6"/>
    <circle cx="300" cy="182" r="4"/>
    <circle cx="330" cy="172" r="5"/>
    <circle cx="224" cy="180" r="3.5"/>
  </g>

  <!-- ladle -->
  <g stroke="#241f1b" stroke-width="2">
    <path d="M 486 250 a 30 28 0 0 0 60 0 Z" fill="#f7f4ee"/>
    <path d="M 486 250 L 546 250" fill="none"/>
    <path d="M 516 250 L 516 152" fill="none" stroke-linecap="round"/>
    <path d="M 516 152 q 0 -14 16 -14" fill="none"/>
  </g>

  <!-- tare dish -->
  <g stroke="#241f1b" stroke-width="2">
    <path d="M 78 266 a 44 22 0 0 0 88 0 Z" fill="#fffdf8"/>
    <path d="M 78 266 L 166 266" fill="none"/>
    <ellipse cx="122" cy="268" rx="34" ry="9" fill="#3b2a22" stroke="none"/>
  </g>
</svg>
