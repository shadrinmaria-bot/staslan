<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="A minimal drawing of a yatai, a Japanese mobile ramen cart, with a paper lantern, a steaming pot and a customer at the counter.">
  <rect width="640" height="420" fill="#f2efe9"/>

  <!-- moon -->
  <circle cx="556" cy="76" r="30" fill="#e6e0d3"/>
  <circle cx="545" cy="68" r="25" fill="#f2efe9"/>

  <!-- cart: roof and posts -->
  <g stroke="#241f1b" stroke-width="2.2">
    <path d="M 128 122 L 452 122 L 424 92 L 156 92 Z" fill="#b8472d"/>
    <line x1="166" y1="122" x2="166" y2="250"/>
    <line x1="414" y1="122" x2="414" y2="250"/>
  </g>

  <!-- noren curtain -->
  <g>
    <rect x="172" y="124" width="236" height="46" fill="#2f3a44"/>
    <g stroke="#f2efe9" stroke-width="3">
      <line x1="231" y1="158" x2="231" y2="170"/>
      <line x1="290" y1="158" x2="290" y2="170"/>
      <line x1="349" y1="158" x2="349" y2="170"/>
    </g>
    <text x="290" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="20" letter-spacing="9" fill="#f2efe9">RAMEN</text>
  </g>

  <!-- counter and cart body -->
  <g stroke="#241f1b" stroke-width="2.2">
    <rect x="146" y="248" width="288" height="14" fill="#d9c9ae"/>
    <rect x="166" y="262" width="248" height="80" fill="#f7f4ee"/>
    <line x1="166" y1="300" x2="414" y2="300"/>
    <line x1="290" y1="262" x2="290" y2="342"/>
    <circle cx="212" cy="350" r="18" fill="#f2efe9"/>
    <circle cx="212" cy="350" r="5" fill="#241f1b"/>
    <circle cx="368" cy="350" r="18" fill="#f2efe9"/>
    <circle cx="368" cy="350" r="5" fill="#241f1b"/>
  </g>

  <!-- paper lantern -->
  <g>
    <line x1="470" y1="112" x2="470" y2="146" stroke="#241f1b" stroke-width="1.5"/>
    <rect x="457" y="146" width="26" height="6" fill="#241f1b"/>
    <ellipse cx="470" cy="180" rx="24" ry="30" fill="#e8a33c" stroke="#241f1b" stroke-width="1.6"/>
    <g stroke="#c98a2b" stroke-width="1">
      <line x1="448" y1="168" x2="492" y2="168"/>
      <line x1="446" y1="180" x2="494" y2="180"/>
      <line x1="448" y1="192" x2="492" y2="192"/>
    </g>
    <rect x="457" y="208" width="26" height="6" fill="#241f1b"/>
  </g>

  <!-- steam from the pot -->
  <g fill="none" stroke="#a8a29a" stroke-width="2" stroke-linecap="round">
    <path d="M 226 240 q -14 -24 2 -40 q 14 -16 2 -32"/>
    <path d="M 254 242 q -10 -20 2 -34 q 12 -14 2 -26"/>
  </g>

  <!-- pot and bowls on the counter -->
  <g stroke="#241f1b" stroke-width="2">
    <rect x="214" y="238" width="52" height="11" rx="3" fill="#cbd0cc"/>
    <line x1="206" y1="243" x2="214" y2="243"/>
    <line x1="266" y1="243" x2="274" y2="243"/>
    <path d="M 316 240 a 22 9 0 0 0 44 0 Z" fill="#fffdf8"/>
    <path d="M 374 242 a 16 7 0 0 0 32 0 Z" fill="#fffdf8"/>
  </g>

  <!-- customer on a stool, facing the counter -->
  <g stroke="#241f1b" stroke-width="2">
    <!-- stool -->
    <rect x="474" y="320" width="56" height="9" rx="3" fill="#d9c9ae"/>
    <line x1="484" y1="329" x2="480" y2="352"/>
    <line x1="520" y1="329" x2="524" y2="352"/>
    <!-- legs -->
    <path d="M 486 320 q -14 8 -18 32" fill="none" stroke-linecap="round"/>
    <!-- torso leaning towards the counter -->
    <path d="M 494 268 q 18 -8 30 6 q 10 12 8 46 l -50 0 q -4 -38 12 -52 Z" fill="#2f3a44"/>
    <!-- arm reaching to the bowl -->
    <path d="M 494 286 L 444 256" fill="none" stroke-linecap="round" stroke-width="4.5"/>
    <!-- head -->
    <circle cx="512" cy="248" r="18" fill="#f7f4ee"/>
  </g>

  <!-- ground -->
  <line x1="48" y1="352" x2="592" y2="352" stroke="#241f1b" stroke-width="1.5"/>
</svg>
